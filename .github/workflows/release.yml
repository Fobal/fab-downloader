name: Release

# Push a tag like v1.0.0 (matching fabdl.__version__) to build and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PYINSTALLER_VERSION: "6.22.3"
  BUILD_VERSION: "1.6.1"
  PILLOW_VERSION: "13.0.0"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import fabdl; print(fabdl.__version__)")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match fabdl.__version__ $version"
            exit 1
          fi

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Install build tools
        run: python -m pip install "pyinstaller==$PYINSTALLER_VERSION" "build==$BUILD_VERSION"

      # Only the window is released as an executable; the command line comes with pipx or the source.
      # --icon and --add-data paths are absolute because PyInstaller resolves them from --specpath.
      - name: Build the executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name fab-downloader-windows \
            --paths . --distpath dist/exe --workpath build/pyinstaller --specpath build \
            --icon "$GITHUB_WORKSPACE/fabdl/icon.ico" --add-data "$GITHUB_WORKSPACE/fabdl/icon.ico;fabdl" \
            packaging/fabdl_gui.py

      # A windowed executable that fails shows an error dialog instead of exiting, hence the timeout.
      - name: Smoke test the executable
        timeout-minutes: 2
        env:
          FABDL_SMOKE_TEST: "1"
        run: dist/exe/fab-downloader-windows.exe

      - name: Build sdist and wheel
        run: python -m build --outdir dist/python

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executable
          path: dist/exe/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/python/*
          if-no-files-found: error

  # The executable runs on Linux with the same or a newer glibc than the build machine's, so it
  # is built on the oldest Ubuntu runner.
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Unit tests
        run: xvfb-run -a python -m unittest discover -s tests -t .

      - name: Install PyInstaller
        run: python -m pip install "pyinstaller==$PYINSTALLER_VERSION"

      # Tk on X11 cannot read .ico files, so the window uses icon.png here.
      - name: Build the executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name fab-downloader-linux-x86_64 \
            --paths . --distpath dist/exe --workpath build/pyinstaller --specpath build \
            --add-data "$GITHUB_WORKSPACE/fabdl/icon.png:fabdl" \
            packaging/fabdl_gui.py

      - name: Smoke test the executable
        timeout-minutes: 2
        env:
          FABDL_SMOKE_TEST: "1"
        run: xvfb-run -a dist/exe/fab-downloader-linux-x86_64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executable-linux
          path: dist/exe/fab-downloader-linux-x86_64
          if-no-files-found: error

  # An app bundle for Apple silicon, the runner's architecture. Intel Macs use pipx or the source.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      # Pillow lets PyInstaller turn icon.png into the bundle's .icns icon.
      - name: Install build tools
        run: python -m pip install "pyinstaller==$PYINSTALLER_VERSION" "pillow==$PILLOW_VERSION"

      # --windowed builds "Fab Downloader.app". PyInstaller signs it ad hoc, which Apple silicon
      # requires; it is not signed with a Developer ID or notarized.
      - name: Build the app
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "Fab Downloader" \
            --osx-bundle-identifier io.github.fobal.fab-downloader \
            --paths . --distpath dist/exe --workpath build/pyinstaller --specpath build \
            --icon "$GITHUB_WORKSPACE/fabdl/icon.png" --add-data "$GITHUB_WORKSPACE/fabdl/icon.png:fabdl" \
            packaging/fabdl_gui.py

      # PyInstaller has no option for the bundle version. Changing Info.plist breaks the
      # signature, so the bundle is signed (ad hoc) again.
      - name: Set the app version
        run: |
          version=$(python -c "import fabdl; print(fabdl.__version__)")
          app="dist/exe/Fab Downloader.app"
          plutil -replace CFBundleShortVersionString -string "$version" "$app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$version" "$app/Contents/Info.plist"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"

      - name: Smoke test the app
        timeout-minutes: 2
        env:
          FABDL_SMOKE_TEST: "1"
        run: '"dist/exe/Fab Downloader.app/Contents/MacOS/Fab Downloader"'

      # ditto keeps the bundle's symlinks and signature intact, which zip does not.
      - name: Zip the app
        run: ditto -c -k --keepParent "dist/exe/Fab Downloader.app" dist/fab-downloader-macos-arm64.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executable-macos
          path: dist/fab-downloader-macos-arm64.zip
          if-no-files-found: error

  github-release:
    needs: [build, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Sign the attestation with a short-lived certificate tied to this workflow, and store it.
      id-token: write
      attestations: write
    steps:
      # Only the executables: the sdist and wheel are published to PyPI.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: executable*
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum fab-downloader-* > SHA256SUMS
      # Proves the files were built by this workflow from this tag. Anyone can check a download with
      #   gh attestation verify <file> -R Fobal/fab-downloader
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --title "Fab Downloader $GITHUB_REF_NAME" --generate-notes

  # Optional: publish the sdist and wheel to PyPI with trusted publishing (no API token).
  # It needs a one-time setup first, otherwise leave it off:
  #   1. On PyPI, add a trusted publisher for this repository with workflow "release.yml" and
  #      environment "pypi" (https://docs.pypi.org/trusted-publishers/). For a new project, use
  #      a "pending publisher".
  #   2. In the GitHub repository settings, create an environment named "pypi".
  #   3. Add a repository variable PUBLISH_TO_PYPI with the value "true" to turn this job on.
  pypi-publish:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fab-downloader/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      # Also publishes PyPI attestations for the sdist and wheel.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
